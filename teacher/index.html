<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이어 그리기 결과 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 게임과 같은 흰 바탕. 위에는 교시 거르기와 상태, 아래에는 모둠 결과 카드 격자 */
  --bg:#ffffff;--line:#e2e5ea;--ink:#0f172a;--dim:#64748b;--cell:#f3f5f8;
  --red:#e02424;--blue:#2563eb;--ok:#16a34a;--warn:#dc2626;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:600;margin:0}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:500;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--ink);border-color:var(--ink);color:#fff}
.back{border-radius:999px;padding:6px 14px;font-size:14px}
.status{margin-left:auto;font-size:14px;color:var(--dim)}
.status.bad{color:var(--warn)}
main{padding:18px 20px 40px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-size:24px;font-weight:600}
.login p{margin:0;color:var(--dim);font-size:14px}
.login input{padding:11px;border-radius:8px;border:1px solid var(--line);font-size:18px;width:100%}
.err{min-height:22px;color:var(--warn)!important;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters span{font-size:14px;color:var(--dim);margin-right:4px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--dim);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.count{font-size:14px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .group{font-size:18px;font-weight:600}
.card .meta{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.card img,.card .noimg{width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:8px;background:#fff}
.card .noimg{display:grid;place-items:center;color:var(--dim);font-size:13px;background:var(--cell)}
.card .word{font-size:22px;font-weight:600;color:var(--blue)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.pill.o{background:#dcfce7;color:#166534}
.pill.x{background:#fee2e2;color:#991b1b}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:15px}
.keys i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.keys .none{color:var(--dim);font-size:13px}
.empty{color:var(--dim);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <a class="btn back" href="../">← 목록으로</a>
  <h1>이어 그리기 결과 보기</h1>
  <span class="status" id="status"></span>
</header>
<main>
  <form class="login" id="login">
    <h2>선생님 확인</h2>
    <p>학생들이 제출한 결과를 보려면 선생님 비밀번호를 넣으세요.</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="선생님 비밀번호">
    <p class="err" id="err" aria-live="polite"></p>
    <button class="btn main" type="submit">열기</button>
  </form>

  <section id="board" hidden>
    <div class="filters" id="filters"></div>
    <p class="count" id="count"></p>
    <ul class="cards" id="cards"></ul>
    <p class="empty" id="empty" hidden>아직 제출된 결과가 없어요. 학생이 「선생님께 제출」을 누르면 여기에 나타나요.</p>
  </section>
</main>

<script>document.write('<script src="../config.js?t='+Date.now()+'"><\/script>')</script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var COLORS=["#0f172a","#2563eb","#e02424","#16a34a","#9333ea"];
var URL_=window.SHEET_URL||"",pin="",since=1,rows=[],filter=0,timer=null,busy=false;

function status(text,bad){$("status").textContent=text;$("status").className="status"+(bad?" bad":"")}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function draw(){
  var periods={};rows.forEach(function(r){periods[r.period]=1});
  var list=Object.keys(periods).map(Number).sort(function(a,b){return a-b});
  var f=$("filters");f.innerHTML="";f.appendChild(el("span","","교시"));
  [0].concat(list).forEach(function(p){
    var b=el("button","chip",p?p+"교시":"전체");b.setAttribute("aria-pressed",String(filter===p));
    b.onclick=function(){filter=p;draw()};f.appendChild(b);
  });
  var shown=rows.filter(function(r){return !filter||r.period===filter}).slice().reverse();
  $("count").textContent="오늘 제출 "+shown.length+"건 · 최근 것이 앞에 나와요";
  $("empty").hidden=shown.length>0;
  var ul=$("cards");ul.innerHTML="";
  shown.forEach(function(r){
    var li=el("li","card");
    var top=el("div","top");top.appendChild(el("span","group",r.group+"모둠"));top.appendChild(el("span","meta",r.period+"교시 · "+r.time.slice(0,5)));
    li.appendChild(top);
    if(r.img&&r.img.indexOf("data:image/jpeg;base64,")===0){var im=el("img");im.alt=r.group+"모둠이 그린 그림";im.src=r.img;li.appendChild(im)}
    else li.appendChild(el("div","noimg","그림 없음"));
    var w=el("div","top");w.appendChild(el("span","word",r.word));
    w.appendChild(el("span","pill "+(r.solved?"o":"x"),r.solved?r.tries+"번 만에 맞힘":"못 맞힘"));
    li.appendChild(w);
    li.appendChild(el("span","meta",r.genre+" · "+r.n+"명이 "+r.secs+"초씩"));
    var ks=el("ul","keys");
    if(!r.keys.length)ks.appendChild(el("li","none","핵심요소를 적지 않았어요"));
    r.keys.forEach(function(k,i){
      var item=el("li");var dot=el("i");dot.style.background=COLORS[i]||"#64748b";item.appendChild(dot);
      item.appendChild(document.createTextNode((i+1)+"번: "+(k||"(빈칸)")));ks.appendChild(item);
    });
    li.appendChild(ks);ul.appendChild(li);
  });
}

function load(first){
  if(busy)return;busy=true;
  fetch(URL_+"?pin="+encodeURIComponent(pin)+"&since="+since+"&_="+Date.now(),{redirect:"follow"})
    .then(function(r){return r.json()})
    .then(function(j){
      busy=false;
      if(!j.ok){
        if(first){$("err").textContent=j.error==="pin"?"비밀번호가 달라요.":"불러오지 못했어요.";return}
        status("불러오지 못했어요",true);return;
      }
      if(first){$("login").hidden=true;$("board").hidden=false;timer=setInterval(function(){if(!document.hidden)load(false)},10000)}
      rows=rows.concat(j.rows);since=Math.max(since,j.last);
      var d=new Date();status("연결됨 · "+d.getHours()+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2)+" 갱신 · 10초마다 새로 고쳐요");
      if(first||j.rows.length)draw();
    })
    .catch(function(){busy=false;if(first)$("err").textContent="구글 시트에 연결하지 못했어요. config.js의 주소와 배포 설정을 확인하세요.";else status("연결이 끊겼어요. 다시 시도하는 중",true)});
}

$("login").onsubmit=function(e){
  e.preventDefault();
  if(!URL_){$("err").textContent="아직 구글 시트 주소가 설정되지 않았어요 (config.js).";return}
  pin=$("pin").value;$("err").textContent="";load(true);
};
if(!URL_)$("err").textContent="아직 구글 시트 주소가 설정되지 않았어요 (config.js).";
})();
</script>
</body>
</html>
