<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../theme.js"></script>
<title>아날로그와 디지털을 이겨라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* 다른 게임과 같은 흰 바탕. 가운데 큰 스톱워치 하나, 그 아래 큰 시작·멈춤 버튼 */
  --bg:#ffffff;--line:#e2e5ea;--ink:#0f172a;--dim:#64748b;--cell:#f3f5f8;
  --red:#e02424;--blue:#2563eb;--ok:#16a34a;--warn:#dc2626;--gold:#d4a017;
  --okbg:#dcfce7;--badbg:#fee2e2;--soft:#eff4ff;--face:#fbfbf8;--metal:#9aa3ae;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121815;--line:#2b3831;--ink:#eef3ef;--dim:#9aaba1;--cell:#1c2520;
  --red:#f26a5f;--blue:#6ea0ff;--ok:#4ade80;--warn:#f87171;--gold:#f5c542;
  --okbg:#173a26;--badbg:#3f1d1d;--soft:#1c2b45;--face:#1f2924;--metal:#5d6b63;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:600;margin:0}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);white-space:nowrap;font-weight:500;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.big{padding:13px 22px;font-size:18px}
.back{border-radius:999px;padding:6px 14px;font-size:14px}
main{flex:1;padding:18px 20px 32px;display:flex;flex-direction:column;align-items:center}
.screen{width:100%;max-width:760px;display:flex;flex-direction:column;gap:16px;align-items:center}
h2{font-size:clamp(22px,3.4vw,28px);font-weight:700;margin:0;text-align:center;text-wrap:balance}
p{margin:0}
.dim{color:var(--dim);font-size:15px;text-align:center;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* 고르기 화면 */
.lbl{align-self:flex-start;font-size:17px;font-weight:700;margin:6px 0 -6px}
.targets{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.target{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 10px;border-radius:16px;border:2px solid var(--line);background:var(--bg)}
.target b{font-size:clamp(36px,7vw,52px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.target span{font-size:14px;color:var(--dim)}
.target small{font-size:13px;color:var(--ok);font-weight:600;min-height:1.4em}
.target:hover{border-color:var(--blue)}
.howto{width:100%;margin:0;padding:14px 18px 14px 36px;border-radius:12px;background:var(--cell);font-size:15.5px}
.howto li{margin:3px 0}
.howto b{font-weight:600}

.kinds{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.kind{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.kind .ico{font-size:32px;line-height:1.2}
.kind b{font-size:18px;font-weight:700}
.kind small{font-size:13px;color:var(--dim)}
.kind[aria-pressed="true"]{border-color:var(--blue);background:var(--soft)}
.kind[aria-pressed="true"] b{color:var(--blue)}
.dwatch{position:relative;width:min(100%,460px)}
.lcd{position:relative;border-radius:22px;padding:34px 22px 30px;background:#2c3530;border:10px solid var(--metal);box-shadow:inset 0 4px 14px rgba(0,0,0,.45);display:flex;align-items:baseline;justify-content:center;gap:10px}
.lcd b{display:inline-flex;font-family:"Orbitron",ui-monospace,monospace;font-weight:800;font-size:clamp(56px,13vw,92px);letter-spacing:0;color:#a6f3a1;text-shadow:0 0 12px rgba(150,255,150,.35);font-variant-numeric:tabular-nums;line-height:1}
.lcd .dg{display:inline-block;width:.82em;text-align:center}
.lcd .dg.dot{width:.36em}
.lcd .lcdunit{font-family:"Orbitron",ui-monospace,monospace;font-weight:600;font-size:16px;color:#7fbf7b}
.lcd .lcdgoal{position:absolute;top:10px;left:16px;font-family:"Orbitron",ui-monospace,monospace;font-size:13px;color:#ff8a7a;letter-spacing:1px}
.lcd.early b{color:#ff9a8a}
.lcd.exact b{color:#7dfc9a}

/* 플레이 화면 */
.playhead{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.playhead .btn{justify-self:start;font-size:16px;padding:9px 16px}
.goal{font-size:clamp(20px,3vw,24px);font-weight:700}
.goal em{font-style:normal;color:var(--red)}
.watch{position:relative;width:min(100%,52vh,400px);aspect-ratio:360/400}
.watch svg{display:block;width:100%;height:100%}
.case{fill:var(--metal)}
.crown{fill:var(--metal)}
.faceplate{fill:var(--face);stroke:var(--line);stroke-width:2}
.tick{stroke:var(--ink);stroke-linecap:round}
.tick.minor{stroke:var(--dim)}
.num{fill:var(--ink);font-family:var(--font-body);font-weight:600;text-anchor:middle;dominant-baseline:central}
.goalline{stroke:var(--red);stroke-width:5;stroke-linecap:round}
.goalwedge{fill:var(--red);opacity:.14}
.goalpill{fill:var(--red)}
.goallabel{fill:#fff;font-family:var(--font-body);font-weight:700;text-anchor:middle;dominant-baseline:central}
.needle{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.needle-tail{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.hub{fill:var(--ink)}
.hub2{fill:var(--red)}
.unit{fill:var(--dim);font-family:var(--font-body);font-size:13px;text-anchor:middle}
.readout{font-size:clamp(40px,8vw,60px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-height:1em}
.readout small{font-size:.45em;font-weight:600;color:var(--dim);margin-left:4px}
.readout.early{color:var(--warn)}
.readout.late{color:var(--blue)}
.readout.exact{color:var(--ok)}

.go{min-width:220px;padding:20px 30px;border-radius:999px;border:0;font-size:clamp(22px,4vw,28px);font-weight:700;background:var(--ink);color:var(--bg)}
.go.stop{background:var(--red);color:#fff}
.go[disabled]{opacity:.4;cursor:default}
.msg{min-height:28px;font-size:18px;font-weight:600;text-align:center;text-wrap:balance}
.msg.bad{color:var(--warn)}

/* 결과 창 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.result{width:min(100%,520px);background:var(--bg);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 20px 50px rgba(15,23,42,.3)}
.result h2{font-size:26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.result h2.exact{color:var(--ok)}
.result h2.early{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:var(--cell);border-radius:10px;padding:8px}
.stats dt{font-size:13px;color:var(--dim)}
.stats dd{margin:0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats .diff{border:3px solid currentColor;background:var(--bg)}
.stats .diff dt{color:inherit;font-weight:700}
.stats .diff dd{font-size:clamp(28px,6vw,36px);line-height:1.15}
.stats .diff.early{color:var(--warn)}
.stats .diff.late{color:var(--blue)}
.stats .diff.exact{color:var(--ok)}
.concept b{color:var(--blue);font-weight:700}
.concept{border:2px solid var(--blue);border-radius:14px;padding:14px;font-size:clamp(18px,3vw,21px);font-weight:600;line-height:2.2}
.pickset{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;vertical-align:middle;margin:0 2px}
.pickset button{border:0;background:var(--bg);padding:2px 12px;font-size:.92em;font-weight:600;color:var(--dim)}
.pickset button+button{border-left:2px solid var(--line)}
.pickset button[aria-pressed="true"]{background:var(--blue);color:#fff}
.pickset.right{border-color:var(--ok)}
.pickset.right button[aria-pressed="true"]{background:var(--ok)}
.pickset.wrong{border-color:var(--warn);animation:shake .25s}
.pickset.wrong button[aria-pressed="true"]{background:var(--warn)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.verdict{min-height:24px;font-size:16px;font-weight:600;text-wrap:balance}
.verdict.good{color:var(--ok)}
.verdict.bad{color:var(--warn)}
.explain{font-size:15px;background:var(--okbg);border-radius:10px;padding:10px 12px;text-align:left}

@media (max-width:520px){.targets{gap:6px}.target{padding:14px 4px}.target b{font-size:30px}}
</style>
</head>
<body>
<header>
  <a class="btn back" href="../../">← 목록으로</a>
  <h1>아날로그와 디지털을 이겨라</h1>
  <button class="btn" data-theme-toggle style="padding:6px 12px;font-size:14px"></button>
</header>

<main>
  <!-- 목표 시간 고르기 -->
  <section class="screen" id="s-pick">
    <p class="lbl">시계 종류</p>
    <div class="kinds" role="group" aria-label="시계 종류">
      <button class="kind" data-kind="analog"><span class="ico">⏱️</span><b>아날로그</b></button>
      <button class="kind" data-kind="digital"><span class="ico">🔢</span><b>디지털</b></button>
    </div>
    <p class="lbl">목표 시간</p>
    <div class="targets" id="targets"></div>
    <p class="lbl">주의사항</p>
    <ol class="howto">
      <li>시계 종류와 목표 시간을 골라요.</li>
      <li>시작을 누르고 목표 시간이 되는 순간! <b>멈춤</b>을 눌러요.</li>
    </ol>
  </section>

  <!-- 도전 -->
  <section class="screen" id="s-play" hidden>
    <div class="playhead">
      <button class="btn" id="p-back">◀ 뒤로</button>
      <p class="goal">목표: <em id="p-goal">5.00초</em></p>
      <span class="ph-space" aria-hidden="true"></span>
    </div>
    <div class="watch" id="watch">
      <svg id="dial" viewBox="0 0 360 400" role="img" aria-label="아날로그 초시계"></svg>
    </div>
    <div class="dwatch" id="dwatch" hidden>
      <div class="lcd" aria-label="디지털 시계"><span class="lcdgoal" id="lcd-goal"></span><b id="lcd">00.00</b><span class="lcdunit">SEC</span></div>
    </div>
    <div class="readout" id="readout"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <button class="go" id="go">시작</button>
    <div class="row" id="after" hidden>
      <button class="btn main big" id="retry">다시 도전</button>
      <button class="btn big" id="to-pick">다른 시간 고르기</button>
    </div>
  </section>
</main>

<!-- 마지막 결과 창 -->
<div class="overlay" id="overlay" hidden>
  <div class="result" role="dialog" aria-modal="true" aria-labelledby="r-title">
    <h2 id="r-title" class="sr">결과</h2>
    <dl class="stats" id="r-stats"></dl>
    <div class="concept" id="concept">
      시간이 <b id="c-kind">디지털</b>로 표현될 때
      <span class="pickset" id="ps1" role="group" aria-label="연속적 또는 불연속적"><button data-v="c">연속적</button><button data-v="n">불연속적</button></span>
      이라 딱
      <span class="pickset" id="ps2" role="group" aria-label="떨어진다 또는 안 떨어진다"><button data-v="y">떨어진다</button><button data-v="n">안 떨어진다</button></span>
      !
    </div>
    <button class="btn main big" id="r-check">확인</button>
    <p class="dim" id="r-lock">퀴즈를 맞혀야 다시 도전할 수 있어요.</p>
    <p class="verdict" id="r-verdict" aria-live="polite"></p>
    <p class="explain" id="r-explain" hidden></p>
    <div class="row">
      <button class="btn main big" id="r-again" hidden>다시 도전</button>
      <button class="btn big" id="r-pick" hidden>다른 시간 고르기</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var TARGETS=[1,3,5,8,10];
// 목표마다 스톱워치 눈금: 한 바퀴 길이, 큰 눈금 간격, 작은 눈금 간격, 숫자 간격
var SCALE={1:{max:1.5,major:.25,minor:.05,label:.5},3:{max:4,major:.5,minor:.1,label:1},5:{max:8,major:1,minor:.2,label:1},8:{max:12,major:1,minor:.2,label:2},10:{max:15,major:1,minor:.5,label:5}};
var S={kind:"analog",target:5,state:"ready",t0:0,t:0,anim:0};
var KEY="mig|g5|best";

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function f2(n){return n.toFixed(2)}
function show(id){["s-pick","s-play"].forEach(function(s){$(s).hidden=s!==id});window.scrollTo(0,0)}

/* ---------- 고르기 ---------- */
function bestKey(t){return S.kind+"|"+t}
function fmtT(t){return S.kind==="digital"?f2(t):t.toFixed(4)+"…"}
function fmtD(d){return S.kind==="digital"?f2(d):"약 "+f2(d)}
function drawPick(){
  var kb=document.querySelectorAll(".kind");for(var i=0;i<kb.length;i++)kb[i].setAttribute("aria-pressed",String(kb[i].getAttribute("data-kind")===S.kind));
  var best=load(),box=$("targets");box.innerHTML="";
  TARGETS.forEach(function(t){
    var b=document.createElement("button");b.className="target";
    var big=document.createElement("b");big.textContent=t;b.appendChild(big);
    var sp=document.createElement("span");sp.textContent="초";b.appendChild(sp);
    var sm=document.createElement("small");var bv=best[bestKey(t)];sm.textContent=bv!=null?"최고 "+(bv===0?"딱 맞춤!":fmtD(bv)+"초 차이"):"";b.appendChild(sm);
    b.onclick=function(){S.target=t;start();};
    box.appendChild(b);
  });
}

/* ---------- 스톱워치 그리기 ---------- */
var CX=180,CY=220,R=150;
function pt(sec,r){var sc=SCALE[S.target],a=(sec/sc.max)*2*Math.PI-Math.PI/2;return [CX+r*Math.cos(a),CY+r*Math.sin(a)]}
function drawDial(needleSec){
  var sc=SCALE[S.target],h="";
  // 몸체와 꼭지
  h+='<rect class="crown" x="160" y="20" width="40" height="26" rx="6"/><rect class="crown" x="172" y="44" width="16" height="14"/>';
  h+='<circle class="case" cx="'+CX+'" cy="'+CY+'" r="'+(R+20)+'"/><circle class="faceplate" cx="'+CX+'" cy="'+CY+'" r="'+(R+6)+'"/>';
  // 목표 구간 표시와 목표선
  var g0=pt(S.target,R+4),gi=pt(S.target,R-22);
  var w1=pt(S.target-sc.minor/2,R),w2=pt(S.target+sc.minor/2,R);
  h+='<path class="goalwedge" d="M'+CX+" "+CY+" L"+w1[0]+" "+w1[1]+" A"+R+" "+R+" 0 0 1 "+w2[0]+" "+w2[1]+' Z"/>';
  h+='<line class="goalline" x1="'+gi[0]+'" y1="'+gi[1]+'" x2="'+g0[0]+'" y2="'+g0[1]+'"/>';
  // 눈금
  var steps=Math.round(sc.max/sc.minor);
  for(var i=0;i<steps;i++){
    var sec=i*sc.minor,isMajor=Math.abs(sec/sc.major-Math.round(sec/sc.major))<1e-6;
    var a=pt(sec,R),b=pt(sec,R-(isMajor?18:9));
    h+='<line class="tick'+(isMajor?"":" minor")+'" stroke-width="'+(isMajor?3:1.5)+'" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';
    if(Math.abs(sec/sc.label-Math.round(sec/sc.label))<1e-6){
      var n=pt(sec,R-36);h+='<text class="num" font-size="'+(S.target===1?17:19)+'" x="'+n[0]+'" y="'+n[1]+'">'+(Math.round(sec*10)/10)+"</text>";
    }
  }
  var gl=pt(S.target,R+13);gl[0]=Math.max(21,Math.min(339,gl[0]));   // 목표 표시가 그림 밖으로 잘리지 않게
  h+='<rect class="goalpill" x="'+(gl[0]-19)+'" y="'+(gl[1]-9)+'" width="38" height="18" rx="9"/>';
  h+='<text class="goallabel" font-size="12" x="'+gl[0]+'" y="'+(gl[1]+.5)+'">목표</text>';
  h+='<text class="unit" x="'+CX+'" y="'+(CY+56)+'">초</text>';
  // 바늘
  if(needleSec!=null){
    var cap=Math.min(needleSec,sc.max),tip=pt(cap,R-6),tail=pt(cap+sc.max/2,24);
    h+='<line class="needle-tail" x1="'+CX+'" y1="'+CY+'" x2="'+tail[0]+'" y2="'+tail[1]+'"/>';
    h+='<line class="needle" x1="'+CX+'" y1="'+CY+'" x2="'+tip[0]+'" y2="'+tip[1]+'"/>';
  }
  h+='<circle class="hub" cx="'+CX+'" cy="'+CY+'" r="10"/><circle class="hub2" cx="'+CX+'" cy="'+CY+'" r="4"/>';
  $("dial").innerHTML=h;
}

/* ---------- 진행 ---------- */
function start(){
  S.state="ready";cancelAnimationFrame(S.anim);
  var dig=S.kind==="digital";
  $("p-goal").textContent=f2(S.target)+"초";
  $("watch").hidden=dig;$("dwatch").hidden=!dig;
  drawDial(0);
  $("lcd-goal").textContent="GOAL "+("0"+f2(S.target)).slice(-5);
  lcdSet("00.00");$("lcd").parentNode.className="lcd";
  $("readout").textContent="";$("readout").className="readout";$("readout").hidden=dig;
  $("msg").textContent="";$("msg").className="msg";
  var go=$("go");go.hidden=false;go.disabled=false;go.textContent="시작";go.className="go";
  $("after").hidden=true;$("overlay").hidden=true;
  show("s-play");go.focus();
}
var LCD_CELLS=null;
function lcdSet(txt){
  var el=$("lcd");
  if(!LCD_CELLS){el.textContent="";LCD_CELLS=[];for(var i=0;i<5;i++){var c=document.createElement("span");c.className=i===2?"dg dot":"dg";el.appendChild(c);LCD_CELLS.push(c)}}
  for(var k=0;k<5;k++)if(LCD_CELLS[k].textContent!==txt[k])LCD_CELLS[k].textContent=txt[k];
}
function paint(v,final){
  if(S.kind==="digital")lcdSet(("0"+f2(final?v:Math.floor(v*100)/100)).slice(-5));
  else{drawDial(v);if(final)$("readout").innerHTML=fmtT(v)+"<small>초</small>"}
}
function press(){
  if(S.state==="ready"){
    S.state="run";S.t0=performance.now();
    var go=$("go");go.textContent="멈춤";go.className="go stop";
    // 실제 시간대로 바늘과 숫자를 움직인다
    (function tick(now){if(S.state!=="run")return;paint(Math.max(0,(now-S.t0)/1000),false);S.anim=requestAnimationFrame(tick)})(S.t0);
  }else if(S.state==="run"){
    var ms=performance.now()-S.t0;
    S.state="stopped";cancelAnimationFrame(S.anim);
    // 디지털은 0.01초 칸으로 끊어서 재고, 아날로그는 끊지 않고 그대로 잰다
    S.t=S.kind==="digital"?Math.round(ms/10)/100:ms/1000;
    $("go").disabled=true;$("go").hidden=true;
    paint(S.t,true);
    finish();
  }
}
function finish(){
  var dig=S.kind==="digital";
  var diff=dig?Math.round((S.t-S.target)*100)/100:S.t-S.target;
  if(diff<0){
    S.state="early";
    $("readout").className="readout early";$("lcd").parentNode.className="lcd early";
    $("msg").className="msg bad";
    $("msg").textContent="아직이에요! 목표보다 "+fmtD(-diff)+"초 일렀어요.";
    setTimeout(function(){openResult(diff)},700);
    return;
  }
  S.state="done";
  var exact=dig&&diff===0;
  $("readout").className="readout late";$("lcd").parentNode.className="lcd"+(exact?" exact":"");
  $("msg").className="msg";
  $("msg").textContent=exact?"숫자가 목표에 딱 맞았어요!":"목표보다 "+fmtD(diff)+"초 늦었어요.";
  var best=load(),k=bestKey(S.target),rd=Math.round(diff*100)/100;if(best[k]==null||rd<best[k]){best[k]=rd;save(best)}
  setTimeout(function(){openResult(diff)},700);
}

/* ---------- 마지막 결과 창 ---------- */
var CH={ps1:null,ps2:null};
function openResult(diff){
  var dig=S.kind==="digital",exact=dig&&diff===0;
  var early=diff<0;
  $("r-title").textContent="결과";
  $("c-kind").textContent=dig?"디지털":"아날로그";
  var best=load()[S.target];
  $("r-stats").innerHTML="";
  [["내 기록",fmtT(S.t)+"초"],["차이",exact?"0.00초":(early?"-"+fmtD(-diff):"+"+fmtD(diff))+"초"]].forEach(function(r){
    var d=document.createElement("div"),dt=document.createElement("dt"),dd=document.createElement("dd");if(r[0]==="차이")d.className="diff "+(early?"early":exact?"exact":"late");dt.textContent=r[0];dd.textContent=r[1];d.appendChild(dt);d.appendChild(dd);$("r-stats").appendChild(d);
  });
  CH.ps1=null;CH.ps2=null;
  ["ps1","ps2"].forEach(function(id){var g=$(id);g.className="pickset";var bs=g.querySelectorAll("button");for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed","false")});
  $("r-verdict").textContent="";$("r-verdict").className="verdict";$("r-explain").hidden=true;$("r-check").hidden=false;$("r-lock").hidden=false;$("r-again").hidden=true;$("r-pick").hidden=true;
  $("overlay").hidden=false;$("r-check").focus();
}
["ps1","ps2"].forEach(function(id){
  $(id).onclick=function(e){
    var b=e.target.closest("button");if(!b)return;
    CH[id]=b.getAttribute("data-v");$(id).className="pickset";
    var bs=$(id).querySelectorAll("button");for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",String(bs[i]===b));
  };
});
$("r-check").onclick=function(){
  var v=$("r-verdict");
  if(!CH.ps1||!CH.ps2){v.className="verdict bad";v.textContent="두 칸 모두 골라 주세요.";return}
  // 디지털: 불연속적 · 떨어진다 / 아날로그: 연속적 · 안 떨어진다
  var dig=S.kind==="digital",ok1=CH.ps1===(dig?"n":"c"),ok2=CH.ps2===(dig?"y":"n");
  $("ps1").className="pickset "+(ok1?"right":"wrong");$("ps2").className="pickset "+(ok2?"right":"wrong");
  if(ok1&&ok2){
    v.className="verdict good";v.textContent="정답!";
    $("r-explain").innerHTML=dig
      ?"0.01초처럼 정해진 칸 단위로 끊어서 세요, 그래서 2.00초, 5.00초처럼 딱 떨어지는 값이 나올 수 있어요."
      :fmtT(S.t)+"초처럼 끝없이 이어져서, 목표에 딱 떨어지게 멈추기는 아주 어려워요.";
    $("r-explain").hidden=false;$("r-check").hidden=true;$("r-lock").hidden=true;$("r-again").hidden=false;$("r-pick").hidden=false;$("r-again").focus();
  }else{
    v.className="verdict bad";v.textContent=dig?"다시 골라 보자! 숫자가 0.01초씩 뚝뚝 끊어져 나오는 시계를 떠올려 봐.":"다시 골라 보자! 바늘이 멈추지 않고 미끄러지듯 도는 모습을 떠올려 봐.";
  }
};

document.querySelector(".kinds").onclick=function(e){var b=e.target.closest(".kind");if(!b)return;S.kind=b.getAttribute("data-kind");drawPick()};
$("go").addEventListener("pointerdown",function(e){if(e.button&&e.button!==0)return;e.preventDefault();press()});
$("go").addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();press()}});
$("retry").onclick=start;
$("r-again").onclick=start;
$("to-pick").onclick=function(){drawPick();show("s-pick")};
$("p-back").onclick=function(){S.state="ready";cancelAnimationFrame(S.anim);drawPick();show("s-pick")};
$("r-pick").onclick=function(){$("overlay").hidden=true;drawPick();show("s-pick")};

drawPick();
})();
</script>
</body>
</html>
