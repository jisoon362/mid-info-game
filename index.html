<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지원T의 정보랜드</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 왼쪽은 게임 목록(단원별 또는 게임별), 오른쪽은 QR 코드 한 장. 밝은 모드와 어두운 모드를 함께 정의 */
  --bg:#ffffff;--card:#ffffff;--line:#e2e5ea;--ink:#0f172a;--dim:#64748b;--cell:#f3f5f8;--blue:#2563eb;--ok-bg:#dcfce7;--ok-ink:#166534;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121815;--card:#1a221d;--line:#2b3831;--ink:#eef3ef;--dim:#9aaba1;--cell:#1c2520;--blue:#6ea0ff;--ok-bg:#173a26;--ok-ink:#7be0a6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding:22px 20px 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
h1{font-size:24px;font-weight:600;margin:0}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:500}
.btn.gal{margin-left:auto;text-decoration:none;color:var(--ink)}
.btn.gal2{text-decoration:none;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;padding:4px;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--cell)}
.tabs button{border:1px solid transparent;background:none;border-radius:7px;padding:7px 22px;color:var(--dim);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.search{flex:1;min-width:180px;max-width:320px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.cols{display:grid;grid-template-columns:1fr minmax(260px,340px);gap:20px;align-items:start}
.left{display:flex;flex-direction:column;gap:14px;min-width:0}
.grade{font-size:22px;font-weight:600;margin:0}
.areabox{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.areabox summary,.sub summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px}
.areabox summary::-webkit-details-marker,.sub summary::-webkit-details-marker{display:none}
.areabox summary::before,.sub summary::before{content:"▶";font-size:11px;color:var(--dim);transition:transform .15s;flex:none;align-self:center}
.areabox[open]>summary::before,.sub[open]>summary::before{transform:rotate(90deg)}
.areabox>summary{padding:14px 16px}
.areabox>summary .t{font-size:18px;font-weight:600}
.areabox summary small,.sub summary small{font-size:12px;color:var(--dim);font-weight:400;margin-left:auto}
.areabox.empty>summary .t{color:var(--dim)}
.units{display:flex;flex-direction:column;padding:0 16px 12px 30px}
.sub{border-top:1px solid var(--line)}
.sub>summary{padding:11px 0}
.sub>summary .t{font-size:15.5px;font-weight:500}
.sub.empty>summary .t{color:var(--dim)}
.sub>.list,.sub>.none{margin:0 0 12px}
.sub>.none{padding:0;font-size:14px}
@media (prefers-reduced-motion:reduce){.areabox summary::before,.sub summary::before{transition:none}}
.unit{font-size:19px;font-weight:600;margin:0;display:flex;align-items:baseline;gap:8px}
.unit small{font-size:13px;font-weight:400;color:var(--dim)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.game{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;height:100%;padding:13px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;background:var(--card)}
.game:hover{border-color:var(--blue)}
.no{min-width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--cell);color:var(--blue);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.game b{font-size:17px;font-weight:600}
.open{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok-ink)}
.game .desc,.game .where{grid-column:2/4;font-size:13px;color:var(--dim)}
.game .where{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.none{color:var(--dim);padding:20px 0}
.qr{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qr svg{width:100%;max-width:300px;height:auto;border-radius:8px;background:#fff}
.qr b{font-weight:600}
.qr .short{margin:0;font-size:17px}
.qr .short strong{font-size:22px;color:var(--blue);letter-spacing:.5px}
.qr span{font-size:13px;color:var(--dim);word-break:break-all}
.maphint{margin:0;font-size:15px;color:var(--dim);text-align:center}
.landmap{width:100%;max-width:920px;margin:0 auto}
.landmap svg{display:block;width:100%;height:auto;overflow:visible}
.landmap text{font-family:var(--font-body)}
.landmap .tagbg{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.landmap .t1{font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle}
.landmap .t2{font-size:12px;fill:var(--dim);text-anchor:middle}
.landmap .soon .t1{fill:var(--dim)}
.landmap .start{font-size:15px;font-weight:800;fill:#dc2626;text-anchor:middle}
.landmap .lm{cursor:pointer;outline:none;transition:transform .2s ease-out}
.landmap .lm:hover,.landmap .lm:focus-visible{transform:translateY(-6px)}
.landmap .lm:focus-visible .tagbg,.landmap .lm.picked .tagbg{stroke:var(--blue);stroke-width:3}
.landmap .lm.soon{opacity:.82}
.landmap .bob{animation:bob 4s ease-in-out infinite}
.landmap .bob2{animation:bob 3s ease-in-out infinite}
.landmap .spin{animation:spin 6s linear infinite}
.landmap .hand{animation:spin 8s linear infinite}
.landmap .flag{animation:flag 1.6s ease-in-out infinite}
.landmap .wave{animation:fade 1.6s ease-in-out infinite}
.landmap .plane{animation:plane 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flag{50%{transform:skewY(-6deg)}}
@keyframes fade{50%{opacity:.25}}
@keyframes plane{50%{transform:translate(14px,-10px)}}
:root[data-theme="dark"] .landmap svg{filter:brightness(.82) saturate(.92)}
.mappanel{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.mappanel .pt{margin:0;font-size:21px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mappanel .pt small{font-size:14px;font-weight:500;color:var(--dim)}
.mappanel .pu{margin:6px 0 0;font-size:16px;font-weight:600}
.mappanel .none{padding:2px 0;font-size:14px}
@media (prefers-reduced-motion:reduce){.landmap .bob,.landmap .bob2,.landmap .spin,.landmap .hand,.landmap .flag,.landmap .wave,.landmap .plane{animation:none}.landmap .lm{transition:none}}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
</style>
</head>

<script src="games.js"></script>
<script src="map.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var games=(window.GAMES||[]).slice().sort(function(a,b){return a.no-b.no});
  var view="map",pickedArea=0;
  try{var sv=sessionStorage.getItem("mig|view");if(sv==="game"||sv==="unit")view=sv;pickedArea=+(sessionStorage.getItem("mig|area")||0)}catch(e){}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function where(g){
    var out=g.grade||"";
    (window.CURRICULUM||[]).forEach(function(G){if(G.grade!==g.grade)return;G.areas.forEach(function(A){if(A.no===g.area)out=G.grade+" · "+A.no+". "+A.title+" > ("+g.unit+") "+(A.units[g.unit-1]||"")})});
    return out;
  }
  function card(g,showWhere){
    var li=el("li"),a=el("a","game");a.href="games/"+g.folder+"/";
    a.appendChild(el("span","no",g.no));a.appendChild(el("b","",g.title));a.appendChild(el("span","open","열림"));
    if(g.desc)a.appendChild(el("span","desc",g.desc));
    if(showWhere)a.appendChild(el("span","where",where(g)));
    li.appendChild(a);return li;
  }
  function draw(){
    var left=$("left");left.innerHTML="";
    $("t-map").setAttribute("aria-selected",String(view==="map"));
    $("t-unit").setAttribute("aria-selected",String(view==="unit"));
    $("t-game").setAttribute("aria-selected",String(view==="game"));
    $("search").hidden=view!=="game";
    if(view==="map"){drawMap(left);return}
    if(view==="unit"){
      var open=loadOpen();
      (window.CURRICULUM||[]).forEach(function(G){
        left.appendChild(el("h2","grade",G.grade));
        G.areas.forEach(function(A){
          var inArea=games.filter(function(g){return g.grade===G.grade&&g.area===A.no});
          var akey=G.grade+"|"+A.no;
          var box=el("details","areabox"+(inArea.length?"":" empty"));
          if(open[akey])box.open=true;
          box.addEventListener("toggle",function(){saveOpen(akey,box.open)});
          var sum=el("summary");sum.appendChild(el("span","t",A.no+". "+A.title));
          sum.appendChild(el("small","",inArea.length?"게임 "+inArea.length+"개":"준비 중"));
          box.appendChild(sum);
          var inner=el("div","units");
          A.units.forEach(function(u,k){
            var mine=inArea.filter(function(g){return g.unit===k+1});
            var ukey=akey+"|"+(k+1);
            var sub=el("details","sub"+(mine.length?"":" empty"));
            if(open[ukey])sub.open=true;
            sub.addEventListener("toggle",function(){saveOpen(ukey,sub.open)});
            var h=el("summary");h.appendChild(el("span","t","("+(k+1)+") "+u));
            h.appendChild(el("small","",mine.length?"게임 "+mine.length+"개":"준비 중"));sub.appendChild(h);
            if(mine.length){var ul=el("ul","list");mine.forEach(function(g){ul.appendChild(card(g,false))});sub.appendChild(ul)}
            else sub.appendChild(el("p","none","아직 게임이 없어요."));
            inner.appendChild(sub);
          });
          box.appendChild(inner);
          left.appendChild(box);
        });
      });
    }else{
      var q=$("search").value.trim().toLowerCase();
      var shown=games.filter(function(g){return !q||(g.title+" "+g.desc+" "+where(g)).toLowerCase().indexOf(q)>=0});
      if(!shown.length){left.appendChild(el("p","none","찾는 게임이 없어요. 다른 낱말로 검색해 보세요."));return}
      var ul=el("ul","list");shown.forEach(function(g){ul.appendChild(card(g,true))});left.appendChild(ul);
    }
  }
  // 지도 보기: 랜드마크를 누르면 아래에 그 대단원의 게임이 나온다
  function drawMap(left){
    var G=(window.CURRICULUM||[])[0];if(!G||!window.drawLandMap)return;
    var counts={};games.forEach(function(g){if(g.grade===G.grade)counts[g.area]=(counts[g.area]||0)+1});
    left.appendChild(el("p","maphint","랜드마크를 눌러 보세요! 그 단원의 게임이 아래에 나와요."));
    var box=el("div","landmap");left.appendChild(box);
    var panel=el("section","mappanel");panel.id="mappanel";left.appendChild(panel);
    function pick(no){
      pickedArea=no;try{sessionStorage.setItem("mig|area",String(no))}catch(e){}
      var marks=box.querySelectorAll(".lm");for(var i=0;i<marks.length;i++)marks[i].classList.toggle("picked",+marks[i].getAttribute("data-area")===no);
      var A=G.areas[no-1];panel.innerHTML="";
      var h=el("h2","pt");h.appendChild(el("span","",no+". "+A.title));h.appendChild(el("small","",(window.LAND_NAMES||{})[no]||""));panel.appendChild(h);
      A.units.forEach(function(u,k){
        var mine=games.filter(function(g){return g.grade===G.grade&&g.area===no&&g.unit===k+1});
        panel.appendChild(el("h3","pu","("+(k+1)+") "+u));
        if(mine.length){var ul=el("ul","list");mine.forEach(function(g){ul.appendChild(card(g,false))});panel.appendChild(ul)}
        else panel.appendChild(el("p","none","아직 게임이 없어요. 곧 열려요!"));
      });
    }
    window.drawLandMap(box,G.areas,counts,function(no){pick(no);panel.scrollIntoView({behavior:"smooth",block:"start"})});
    if(pickedArea)pick(pickedArea);else panel.appendChild(el("p","none","지도에서 가고 싶은 곳을 골라 보세요."));
  }
  // 펼친 단원은 이 기기에 기억해 두었다가 다시 들어오면 그대로 펼친다
  function loadOpen(){try{return JSON.parse(localStorage.getItem("mig|open"))||{}}catch(e){return {}}}
  function saveOpen(k,v){var o=loadOpen();if(v)o[k]=1;else delete o[k];try{localStorage.setItem("mig|open",JSON.stringify(o))}catch(e){}}
  function setView(v){view=v;try{sessionStorage.setItem("mig|view",v)}catch(e){}draw()}
  $("t-map").onclick=function(){setView("map")};
  $("t-unit").onclick=function(){setView("unit")};
  $("t-game").onclick=function(){setView("game")};
  $("search").oninput=draw;
  draw();
})();
</script>
